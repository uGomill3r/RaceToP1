<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Championship Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:      #f0f2f5;
      --bg-surface:   #ffffff;
      --bg-card:      #f8f9fb;
      --bg-hover:     #eef0f4;
      --border:       #dde1e8;
      --accent:       #e10600;
      --accent-dim:   #b30400;
      --text-primary:   #0d1117;
      --text-secondary: #4a5568;
      --text-muted:     #8899aa;
      --glow-red:     0 0 20px rgba(225,6,0,0.25);
      --font-display: 'Barlow Condensed', sans-serif;
      --font-body:    'Barlow', sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--bg-deep);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    body {
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(225,6,0,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 60% 30% at 80% 100%, rgba(54,113,198,0.03) 0%, transparent 50%);
    }

    button { cursor: pointer; font-family: var(--font-body); }
    select { font-family: var(--font-body); }

    /* ── HEADER ── */
    .header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { display: flex; align-items: center; gap: 14px; }

    .f1-badge {
      background: var(--accent);
      color: white;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 3px;
      box-shadow: var(--glow-red);
      line-height: 1;
    }

    .title-group { display: flex; flex-direction: column; line-height: 1; }

    .title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    .subtitle {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      color: var(--text-secondary);
    }

    .nav { display: flex; align-items: center; gap: 10px; }

    .season-label {
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .select-wrapper { position: relative; }

    .select-wrapper select {
      appearance: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.05em;
      padding: 6px 32px 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .select-wrapper select:hover, .select-wrapper select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-dim);
    }

    .select-wrapper select:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── MODAL MÁS TEMPORADAS ── */
    .seasons-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .seasons-modal-overlay.open { display: flex; }

    .seasons-modal {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px 28px;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .seasons-modal h3 {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .seasons-modal p {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .seasons-modal-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .season-chip {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .season-chip:hover { border-color: var(--accent); background: var(--bg-hover); }
    .seasons-modal-close {
      width: 100%;
      padding: 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-secondary);
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .seasons-modal-close:hover { border-color: var(--accent); color: var(--text-primary); }

    .select-arrow {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent);
      font-size: 0.75rem;
      pointer-events: none;
    }

    /* ── LAYOUT ── */
    .app { min-height: 100vh; display: flex; flex-direction: column; }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      flex: 1;
      min-height: 0;
    }

    .sidebar {
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      height: calc(100vh - 64px);
      position: sticky;
      top: 64px;
    }

    .chart-area {
      display: flex;
      flex-direction: column;
      padding: 24px 28px;
      gap: 20px;
      min-width: 0;
    }

    /* ── STATES ── */
    .loading-state, .error-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 80px 20px;
    }

    .spinner {
      width: 48px; height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-state p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-family: var(--font-display);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── LEADERBOARD ── */
    .leaderboard { border-bottom: 1px solid var(--border); }

    .lb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--text-muted);
    }

    .race-tag, .final-tag {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 2px 7px;
      border-radius: 3px;
    }

    .race-tag { background: rgba(255,255,255,0.07); color: var(--text-secondary); }
    .final-tag { background: rgba(225,6,0,0.15); color: var(--accent); }

    .lb-empty {
      padding: 24px 16px;
      color: var(--text-muted);
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-align: center;
      text-transform: uppercase;
    }

    .leader-spotlight {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(225,6,0,0.04) 0%, transparent 100%);
    }

    .leader-label {
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .leader-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 4px;
      opacity: 0.9;
    }

    .leader-pts { display: flex; align-items: baseline; gap: 5px; }

    .pts-num {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 2rem;
      color: var(--text-primary);
      line-height: 1;
    }

    .pts-label {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--text-muted);
    }

    .standings-list { list-style: none; padding: 8px 0; }

    .standing-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      transition: background 0.15s;
    }

    .standing-row:hover { background: var(--bg-hover); }
    .standing-row.leader { background: rgba(255,255,255,0.02); }

    .pos {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--text-muted);
      width: 14px;
      text-align: right;
      flex-shrink: 0;
    }

    .standing-row.leader .pos { color: var(--accent); }

    .indicator { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .s-name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      color: var(--text-primary);
      flex: 1;
      text-transform: uppercase;
    }

    .s-pts {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-primary);
      width: 32px;
      text-align: right;
      flex-shrink: 0;
    }

    .s-gap {
      font-family: var(--font-display);
      font-size: 0.7rem;
      color: var(--text-muted);
      width: 36px;
      text-align: right;
      flex-shrink: 0;
    }

    .standings-more {
      padding: 6px 16px;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* ── DRIVER LIST ── */
    .driver-list { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg-surface);
      z-index: 10;
      flex-shrink: 0;
    }

    .header-actions { display: flex; gap: 6px; align-items: center; }

    .btn-sm {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 3px 9px;
      border-radius: 3px;
      transition: all 0.15s;
    }

    .btn-sm:hover { border-color: var(--text-secondary); color: var(--text-primary); }

    .btn-battle {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: var(--font-display);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 9px;
      border-radius: 3px;
      transition: all 0.2s;
    }

    .btn-battle:hover { border-color: var(--accent); color: var(--accent); }
    .btn-battle.active { background: var(--accent); border-color: var(--accent); color: white; box-shadow: 0 0 10px rgba(225,6,0,0.35); }

    .battle-hint {
      background: rgba(225,6,0,0.08);
      border-bottom: 1px solid rgba(225,6,0,0.15);
      padding: 8px 16px;
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .drivers-ul { list-style: none; overflow-y: auto; flex: 1; }

    .driver-item {
      border-bottom: 1px solid rgba(30,45,66,0.5);
      transition: background 0.15s;
      position: relative;
    }

    .driver-item:hover { background: var(--bg-hover); }
    .driver-item.highlighted { background: rgba(255,255,255,0.03); }
    .driver-item.battle-selected { background: rgba(225,6,0,0.06); }
    .driver-item.battle-selected::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--accent);
    }

    .driver-item.battle-unselected { opacity: 0.25; pointer-events: none; }
    .driver-item.d-hidden .driver-btn { opacity: 0.35; }

    .driver-btn {
      background: none;
      border: none;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px 4px;
      text-align: left;
      cursor: pointer;
      color: var(--text-primary);
    }

    .color-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dot-x, .dot-check {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: white;
      font-weight: 900;
    }

    .driver-code {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      width: 28px;
      flex-shrink: 0;
    }

    .driver-name {
      font-size: 0.82rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-name {
      display: block;
      font-size: 0.68rem;
      color: var(--text-muted);
      padding: 2px 16px 8px 54px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── CHART ── */
    .chart-container { display: flex; flex-direction: column; flex: 1; }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }

    .chart-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-primary);
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chart-title .race-name {
      font-weight: 400;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .battle-tag {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      padding: 3px 10px;
      border-radius: 3px;
      background: rgba(225,6,0,0.15);
      border: 1px solid rgba(225,6,0,0.3);
      color: var(--accent);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 8px rgba(225,6,0,0.4); }
      50% { box-shadow: 0 0 20px rgba(225,6,0,0.8); }
    }

    .canvas-wrapper {
      flex: 1;
      min-height: 400px;
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 16px 12px;
    }

    .canvas-wrapper canvas { width: 100% !important; height: 100% !important; }

    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-family: var(--font-display);
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      pointer-events: none;
    }

    /* ── CONTROLS ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 20px;
    }

    .playback { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .btn-rewind, .btn-end {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      width: 32px; height: 32px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      transition: all 0.15s;
    }

    .btn-rewind:hover, .btn-end:hover { border-color: var(--text-secondary); color: var(--text-primary); }

    .btn-play {
      background: var(--accent);
      border: none;
      color: white;
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.2s;
      box-shadow: 0 0 16px rgba(225,6,0,0.3);
      flex-shrink: 0;
    }

    .btn-play:hover { background: #ff1a0e; box-shadow: 0 0 24px rgba(225,6,0,0.6); transform: scale(1.05); }
    .btn-play.playing { background: #cc0400; }

    .icon-pause { display: flex; gap: 3px; align-items: center; }
    .icon-pause span { display: block; width: 3px; height: 14px; background: white; border-radius: 2px; }
    .icon-play { margin-left: 2px; font-size: 0.9rem; }

    .scrubber-group { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }

    .race-info { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

    .race-counter {
      font-family: var(--font-display);
      font-size: 0.95rem;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .race-counter strong { color: var(--accent); font-weight: 700; }
    .muted { color: var(--text-muted); }

    .race-name-display {
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .race-date-display { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }

    .scrubber {
      width: 100%;
      height: 4px;
      appearance: none;
      border-radius: 2px;
      cursor: pointer;
      outline: none;
    }

    .scrubber::-webkit-slider-thumb {
      appearance: none;
      width: 14px; height: 14px;
      background: white;
      border: 2px solid var(--accent);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(225,6,0,0.4);
      transition: transform 0.1s;
    }

    .scrubber::-webkit-slider-thumb:hover { transform: scale(1.2); }
    .scrubber::-moz-range-thumb {
      width: 14px; height: 14px;
      background: white;
      border: 2px solid var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    .speed-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .speed-label {
      font-family: var(--font-display);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      font-weight: 600;
      margin-right: 4px;
    }

    .btn-speed {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 3px;
      transition: all 0.15s;
    }

    .btn-speed:hover { border-color: var(--text-secondary); color: var(--text-primary); }
    .btn-speed.active { background: var(--accent); border-color: var(--accent); color: white; box-shadow: 0 0 8px rgba(225,6,0,0.3); }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border); }
    }

    @media (max-width: 700px) {
      .controls { flex-wrap: wrap; gap: 14px; }
      .scrubber-group { order: 3; width: 100%; }
      .speed-controls { margin-left: auto; }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <div class="f1-badge">F1</div>
      <div class="title-group">
        <span class="title">Championship</span>
        <span class="subtitle">VISUALIZER</span>
      </div>
    </div>
    <nav class="nav">
      <a href="index.html" style="font-family:var(--font-display);font-size:0.75rem;font-weight:600;letter-spacing:0.12em;color:var(--accent);text-decoration:none;text-transform:uppercase">Points Chart</a>
      <a href="heatmap.html" style="font-family:var(--font-display);font-size:0.75rem;font-weight:600;letter-spacing:0.12em;color:var(--text-secondary);text-decoration:none;text-transform:uppercase;transition:color 0.15s" onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-secondary)'">Heatmap</a>
      <label class="season-label" for="season-select">SEASON</label>
      <div class="select-wrapper">
        <select id="season-select" disabled></select>
        <div class="select-arrow">▾</div>
      </div>
    </nav>
  </header>

  <!-- MODAL MÁS TEMPORADAS -->
  <div id="seasons-modal-overlay" class="seasons-modal-overlay" role="dialog" aria-modal="true" aria-label="Seleccionar temporada">
    <div class="seasons-modal">
      <h3>Más temporadas</h3>
      <p>Selecciona una temporada disponible:</p>
      <div id="seasons-modal-chips" class="seasons-modal-chips"></div>
      <button class="seasons-modal-close" id="seasons-modal-close">CERRAR</button>
    </div>
  </div>

  <!-- LOADING -->
  <div id="loading-state" class="loading-state">
    <div class="spinner"></div>
    <p>Loading season data…</p>
  </div>

  <!-- MAIN LAYOUT (hidden until data loads) -->
  <div id="main-layout" class="layout" style="display:none">
    <aside class="sidebar">
      <!-- Leaderboard -->
      <div class="leaderboard">
        <div class="lb-header">
          <span class="section-title">STANDINGS</span>
          <span id="race-tag"></span>
        </div>
        <div id="lb-body">
          <div class="lb-empty">Press play to begin</div>
        </div>
      </div>

      <!-- Driver List -->
      <div class="driver-list">
        <div class="list-header">
          <span class="section-title">DRIVERS</span>
          <div class="header-actions">
            <button id="btn-show-all" class="btn-sm" title="Show all drivers">All</button>
            <button id="btn-hide-all" class="btn-sm" title="Hide all drivers">None</button>
            <button id="btn-battle" class="btn-battle" title="Toggle battle mode">⚔ BATTLE</button>
          </div>
        </div>
        <div id="battle-hint" class="battle-hint" style="display:none"></div>
        <ul id="drivers-ul" class="drivers-ul"></ul>
      </div>
    </aside>

    <!-- Chart Area -->
    <section class="chart-area">
      <div class="chart-container">
        <div class="chart-header">
          <h2 id="chart-title" class="chart-title">Select a race to begin</h2>
          <div id="battle-tag" class="battle-tag" style="display:none">BATTLE MODE</div>
        </div>
        <div class="canvas-wrapper">
          <canvas id="chart-canvas"></canvas>
          <div id="empty-state" class="empty-state">Move the slider to explore the season</div>
        </div>
      </div>

      <!-- Timeline Controls -->
      <div class="controls">
        <div class="playback">
          <button id="btn-rewind" class="btn-rewind" title="Reset to start" aria-label="Reset">⏮</button>
          <button id="btn-play" class="btn-play" aria-label="Play">
            <span class="icon-play">▶</span>
          </button>
          <button id="btn-end" class="btn-end" title="Jump to end" aria-label="Jump to final race">⏭</button>
        </div>

        <div class="scrubber-group">
          <div class="race-info">
            <span id="race-counter" class="race-counter"><span class="muted">— / —</span></span>
            <span id="race-name-display" class="race-name-display"></span>
            <span id="race-date-display" class="race-date-display"></span>
          </div>
          <input type="range" id="scrubber" class="scrubber" min="0" max="0" value="0" aria-label="Race timeline">
        </div>

        <div class="speed-controls">
          <span class="speed-label">SPEED</span>
          <button class="btn-speed" data-speed="1600">0.5×</button>
          <button class="btn-speed active" data-speed="800">1×</button>
          <button class="btn-speed" data-speed="400">2×</button>
          <button class="btn-speed" data-speed="200">4×</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
  // ── STATE ──────────────────────────────────────────────────────────────
  let seasonData = null;
  let currentRace = 0;
  let isPlaying = false;
  let playInterval = null;
  let animationSpeed = 800;
  let hiddenDrivers = new Set();
  let battleMode = false;
  let battleDrivers = [];
  let highlightedDriver = null;
  let chart = null;
  let sortedDrivers = [];

  // ── DOM refs ───────────────────────────────────────────────────────────
  const elSeasonSelect  = document.getElementById('season-select');
  const elLoadingState  = document.getElementById('loading-state');
  const elMainLayout    = document.getElementById('main-layout');
  const elLbBody        = document.getElementById('lb-body');
  const elRaceTag       = document.getElementById('race-tag');
  const elBtnShowAll    = document.getElementById('btn-show-all');
  const elBtnHideAll    = document.getElementById('btn-hide-all');
  const elBtnBattle     = document.getElementById('btn-battle');
  const elBattleHint    = document.getElementById('battle-hint');
  const elDriversUl     = document.getElementById('drivers-ul');
  const elChartTitle    = document.getElementById('chart-title');
  const elBattleTag     = document.getElementById('battle-tag');
  const elEmptyState    = document.getElementById('empty-state');
  const elBtnRewind     = document.getElementById('btn-rewind');
  const elBtnPlay       = document.getElementById('btn-play');
  const elBtnEnd        = document.getElementById('btn-end');
  const elScrubber      = document.getElementById('scrubber');
  const elRaceCounter   = document.getElementById('race-counter');
  const elRaceNameDisp  = document.getElementById('race-name-display');
  const elRaceDateDisp  = document.getElementById('race-date-display');
  const elChartCanvas   = document.getElementById('chart-canvas');

  // ── INIT ───────────────────────────────────────────────────────────────
  async function init() {
    let seasons;
    try {
      const res = await fetch('/data/seasons.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      seasons = await res.json();
    } catch (e) {
      elLoadingState.innerHTML = '<p style="color:#e10600;font-family:sans-serif;text-align:center">⚠ Could not load seasons.json<br><small>' + e.message + '</small></p>';
      return;
    }

    // Mostrar solo las 5 temporadas más recientes en el selector
    const RECENT_COUNT = 5;
    const recentSeasons = seasons.slice(0, RECENT_COUNT);
    const olderSeasons  = seasons.slice(RECENT_COUNT);

    recentSeasons.forEach(year => {
      const opt = document.createElement('option');
      opt.value = year;
      opt.textContent = year;
      elSeasonSelect.appendChild(opt);
    });

    // Opción "Más temporadas..." solo si hay temporadas adicionales
    if (olderSeasons.length > 0) {
      const optMore = document.createElement('option');
      optMore.value = '__more__';
      optMore.textContent = 'Más temporadas…';
      elSeasonSelect.appendChild(optMore);
    }

    // Rellenar chips del modal con las temporadas antiguas
    const elChips = document.getElementById('seasons-modal-chips');
    olderSeasons.forEach(year => {
      const chip = document.createElement('button');
      chip.className = 'season-chip';
      chip.textContent = year;
      chip.addEventListener('click', () => {
        closeModal();
        // Agregar temporada al selector si no existe y seleccionarla
        if (!elSeasonSelect.querySelector(`option[value="${year}"]`)) {
          const opt = document.createElement('option');
          opt.value = year;
          opt.textContent = year;
          elSeasonSelect.insertBefore(opt, elSeasonSelect.lastElementChild);
        }
        elSeasonSelect.value = year;
        loadSeason(year);
      });
      elChips.appendChild(chip);
    });

    // Lógica del modal
    const elModalOverlay = document.getElementById('seasons-modal-overlay');
    const elModalClose   = document.getElementById('seasons-modal-close');

    function openModal()  { elModalOverlay.classList.add('open'); }
    function closeModal() { elModalOverlay.classList.remove('open'); }

    elModalOverlay.addEventListener('click', e => { if (e.target === elModalOverlay) closeModal(); });
    elModalClose.addEventListener('click', closeModal);

    elSeasonSelect.addEventListener('change', () => {
      if (elSeasonSelect.value === '__more__') {
        // Volver al valor anterior y abrir modal
        elSeasonSelect.value = elSeasonSelect.querySelector('option:not([value="__more__"])').value;
        openModal();
        return;
      }
      loadSeason(Number(elSeasonSelect.value));
    });

    await loadSeason(seasons[0]);
  }

  async function loadSeason(year) {
    elSeasonSelect.disabled = true;
    elLoadingState.style.display = 'flex';
    elMainLayout.style.display = 'none';

    stopPlayback();
    currentRace = 0;
    hiddenDrivers = new Set();
    battleMode = false;
    battleDrivers = [];
    highlightedDriver = null;

    let res;
    try {
      res = await fetch(`/data/${year}.json`);
      if (!res.ok) throw new Error(`HTTP ${res.status} — /data/${year}.json`);
      seasonData = await res.json();
    } catch (e) {
      elLoadingState.innerHTML = '<p style="color:#e10600;font-family:sans-serif;text-align:center">⚠ Error loading season ' + year + '<br><small>' + e.message + '</small></p>';
      elSeasonSelect.disabled = false;
      return;
    }
    currentRace = seasonData.totalRaces;

    // Sort drivers by team then name
    sortedDrivers = Object.entries(seasonData.drivers)
      .map(([id, d]) => ({ id, ...d }))
      .sort((a, b) => a.team.localeCompare(b.team) || a.name.localeCompare(b.name));

    // Setup scrubber
    elScrubber.max = seasonData.totalRaces;
    elScrubber.value = currentRace;
    elSeasonSelect.value = year;

    // Init chart
    initChart();
    renderDriverList();
    updateScrubberUI();
    updateLeaderboard();
    updateBattleUI();

    elSeasonSelect.disabled = false;
    elLoadingState.style.display = 'none';
    elMainLayout.style.display = 'grid';
  }

  // ── CHART ──────────────────────────────────────────────────────────────
  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function isDriverVisible(id) {
    if (battleMode) return battleDrivers.includes(id);
    return !hiddenDrivers.has(id);
  }

  // Devuelve el id del piloto de batalla que va ganando en currentRace, o null si empate/sin datos
  function getBattleLeader() {
    if (!battleMode || battleDrivers.length !== 2 || currentRace === 0) return null;
    const snap = seasonData.timeline[currentRace - 1];
    if (!snap) return null;
    const [a, b] = battleDrivers;
    const ptsA = snap.standings[a] ?? 0;
    const ptsB = snap.standings[b] ?? 0;
    if (ptsA === ptsB) return null;
    return ptsA > ptsB ? a : b;
  }

  function buildDatasets() {
    const racesSlice = seasonData.timeline.slice(0, currentRace);
    const battleLeader = getBattleLeader();
    return Object.entries(seasonData.drivers).map(([id, driver]) => {
      const visible = isDriverVisible(id);
      const isHighlighted = highlightedDriver === id;
      // En modo batalla, los pilotos seleccionados nunca se atenúan
      const isBattleSelected = battleMode && battleDrivers.includes(id);

      let opacity = visible ? 1 : 0;
      let lineWidth = 2;
      let pointRadius = 2;

      // Atenuar solo si hay highlight activo, no es el piloto destacado, y no es piloto de batalla
      if (visible && highlightedDriver && !isHighlighted && !isBattleSelected) opacity = 0.12;
      // El líder de la batalla actual lleva línea más gruesa; el hover usa glow en lugar de grosor
      if (battleLeader === id) { lineWidth = 3.5; pointRadius = 3; }

      const data = racesSlice.map(snap => snap.standings[id] ?? null);
      const rgba = a => hexToRgba(driver.color, a);

      return {
        label: id,
        data,
        borderColor: rgba(opacity),
        backgroundColor: rgba(opacity * 0.08),
        borderWidth: lineWidth,
        pointRadius,
        pointHoverRadius: 5,
        pointBackgroundColor: rgba(opacity),
        pointBorderColor: rgba(opacity),
        fill: false,
        tension: 0.35,
        hidden: !visible,
        order: isHighlighted ? 10 : 1,
      };
    });
  }

  function getRaceLabels() {
    return seasonData.timeline
      .slice(0, currentRace)
      .map(r => r.name.replace(' Grand Prix', '').replace(' Grand', ''));
  }

  // Plugin: glow en la línea activa — hover tiene prioridad, si no, líder de batalla
  const glowLinePlugin = {
    id: 'glowLine',
    beforeDatasetDraw(chart, args) {
      const ds = chart.data.datasets[args.index];
      if (!ds) return;
      const id = ds.label;
      const glowTarget = highlightedDriver ?? getBattleLeader();
      if (!glowTarget || id !== glowTarget) return;
      const driver = seasonData?.drivers[id];
      if (!driver) return;
      const ctx = chart.ctx;
      ctx.save();
      ctx.shadowBlur  = 18;
      ctx.shadowColor = driver.color;
    },
    afterDatasetDraw(chart, args) {
      const ds = chart.data.datasets[args.index];
      if (!ds) return;
      const id = ds.label;
      const glowTarget = highlightedDriver ?? getBattleLeader();
      if (!glowTarget || id !== glowTarget) return;
      chart.ctx.restore();
    },
  };
  Chart.register(glowLinePlugin);

  function initChart() {
    if (chart) { chart.destroy(); chart = null; }

    chart = new Chart(elChartCanvas, {
      type: 'line',
      data: {
        labels: getRaceLabels(),
        datasets: buildDatasets(),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 250 },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#ffffff',
            borderColor: '#dde1e8',
            borderWidth: 1,
            titleColor: '#4a5568',
            bodyColor: '#0d1117',
            titleFont: { family: "'Barlow Condensed', sans-serif", size: 11, weight: '600' },
            bodyFont: { family: "'Barlow', sans-serif", size: 12 },
            padding: 10,
            itemSort: (a, b) => (b.raw ?? 0) - (a.raw ?? 0),
            filter: item => (item.raw ?? 0) > 0,
            callbacks: {
              title: items => items[0]?.label ?? '',
              label: item => {
                const id = item.dataset.label;
                const d = seasonData.drivers[id];
                return ` ${d?.code ?? id}  ${item.raw ?? 0} pts`;
              },
              labelColor: item => {
                const id = item.dataset.label;
                const color = seasonData.drivers[id]?.color ?? '#888';
                return { borderColor: color, backgroundColor: color };
              },
            },
          },
        },
        scales: {
          x: {
            grid: { color: 'rgba(30,45,66,0.6)', lineWidth: 1 },
            border: { color: '#1e2d42' },
            ticks: {
              color: '#4a5568',
              font: { family: "'Barlow Condensed', sans-serif", size: 10, weight: '600' },
              maxRotation: 45,
              autoSkip: true,
              maxTicksLimit: 16,
            },
          },
          y: {
            grid: { color: 'rgba(30,45,66,0.4)', lineWidth: 1 },
            border: { color: '#1e2d42' },
            ticks: {
              color: '#4a5568',
              font: { family: "'Barlow', sans-serif", size: 11 },
            },
            title: {
              display: true,
              text: 'CHAMPIONSHIP POINTS',
              color: '#2d3f55',
              font: { family: "'Barlow Condensed', sans-serif", size: 10, weight: '600' },
            },
          },
        },
      },
    });
  }

  function applyHighlightToChart() {
    if (!chart || !seasonData) return;
    const battleLeader = getBattleLeader();
    chart.data.datasets.forEach(ds => {
      const id = ds.label;
      const driver = seasonData.drivers[id];
      if (!driver) return;
      const visible = isDriverVisible(id);
      const isHighlighted = highlightedDriver === id;
      const isBattleSelected = battleMode && battleDrivers.includes(id);

      let opacity = visible ? 1 : 0;
      let lineWidth = 2;
      let pointRadius = 2;

      // Atenuar solo si hay highlight activo, no es el piloto destacado, y no es piloto de batalla
      if (visible && highlightedDriver && !isHighlighted && !isBattleSelected) opacity = 0.12;
      // El líder de la batalla actual lleva línea más gruesa; el hover usa glow en lugar de grosor
      if (battleLeader === id) { lineWidth = 3.5; pointRadius = 3; }

      const rgba = a => hexToRgba(driver.color, a);
      ds.borderColor = rgba(opacity);
      ds.backgroundColor = rgba(opacity * 0.08);
      ds.borderWidth = lineWidth;
      ds.pointRadius = pointRadius;
      ds.pointBackgroundColor = rgba(opacity);
      ds.pointBorderColor = rgba(opacity);
    });
    chart.update('none');
  }

  // Hover sobre líneas del canvas — resalta el piloto más cercano al cursor
  function attachCanvasHover() {
    if (!elChartCanvas) return;
    elChartCanvas.addEventListener('mousemove', e => {
      if (!chart) return;
      const points = chart.getElementsAtEventForMode(e, 'nearest', { intersect: false }, true);
      if (!points.length) return;
      const ds = chart.data.datasets[points[0].datasetIndex];
      if (!ds) return;
      const id = ds.label;
      if (highlightedDriver === id) return; // sin cambio, evitar re-render innecesario
      highlightedDriver = id;
      applyHighlightToChart();
      updateDriverHighlight();
    });

    elChartCanvas.addEventListener('mouseleave', () => {
      if (!highlightedDriver) return;
      highlightedDriver = null;
      applyHighlightToChart();
      updateDriverHighlight();
    });
  }

  function updateChart() {
    if (!chart) return;
    chart.data.labels = getRaceLabels();
    chart.data.datasets = buildDatasets();
    chart.update('active');

    elEmptyState.style.display = currentRace === 0 ? 'flex' : 'none';
  }

  // ── LEADERBOARD ────────────────────────────────────────────────────────
  function getCurrentStandings() {
    if (!seasonData || currentRace === 0) return [];
    const snap = seasonData.timeline[currentRace - 1];
    if (!snap) return [];
    return Object.entries(snap.standings)
      .map(([id, pts]) => ({
        id, pts,
        name: seasonData.drivers[id]?.name ?? id,
        color: seasonData.drivers[id]?.color ?? '#888',
      }))
      .filter(d => d.pts > 0)
      .sort((a, b) => b.pts - a.pts);
  }

  function updateLeaderboard() {
    const standings = getCurrentStandings();
    const total = seasonData?.totalRaces ?? 0;

    // Race tag
    if (currentRace === 0) {
      elRaceTag.textContent = '';
      elRaceTag.className = '';
    } else if (currentRace < total) {
      elRaceTag.textContent = `R${currentRace}`;
      elRaceTag.className = 'race-tag';
    } else {
      elRaceTag.textContent = 'FINAL';
      elRaceTag.className = 'final-tag';
    }

    if (!standings.length) {
      elLbBody.innerHTML = '<div class="lb-empty">Press play to begin</div>';
      return;
    }

    const leader = standings[0];
    const leaderPts = leader.pts;
    const topFive = standings.slice(0, 5);

    let html = `
      <div class="leader-spotlight">
        <div class="leader-label">CHAMPIONSHIP LEADER</div>
        <div class="leader-name" style="color:${leader.color}">${leader.name}</div>
        <div class="leader-pts">
          <span class="pts-num">${leader.pts}</span>
          <span class="pts-label">PTS</span>
        </div>
      </div>
      <ol class="standings-list">
    `;

    topFive.forEach((d, i) => {
      const gap = leaderPts - d.pts;
      const lastName = d.name.split(' ').pop();
      html += `
        <li class="standing-row ${i === 0 ? 'leader' : ''}">
          <span class="pos">${i + 1}</span>
          <span class="indicator" style="background:${d.color};box-shadow:0 0 6px ${d.color}80"></span>
          <span class="s-name">${lastName}</span>
          <span class="s-pts">${d.pts}</span>
          ${i > 0 && gap > 0 ? `<span class="s-gap">–${gap}</span>` : ''}
        </li>
      `;
    });

    if (standings.length > 5) {
      html += `<li class="standings-more">+${standings.length - 5} more drivers</li>`;
    }

    html += '</ol>';
    elLbBody.innerHTML = html;
  }

  // ── DRIVER LIST ────────────────────────────────────────────────────────
  function renderDriverList() {
    elDriversUl.innerHTML = '';
    sortedDrivers.forEach(driver => {
      const isHidden = hiddenDrivers.has(driver.id);
      const isBattleActive = battleDrivers.includes(driver.id);
      const isHighlighted = highlightedDriver === driver.id;
      const isBattleUnselected = battleMode && !isBattleActive && battleDrivers.length === 2;

      const li = document.createElement('li');
      li.dataset.driverId = driver.id;
      li.className = [
        'driver-item',
        isHidden && !battleMode ? 'd-hidden' : '',
        isHighlighted ? 'highlighted' : '',
        isBattleActive ? 'battle-selected' : '',
        isBattleUnselected ? 'battle-unselected' : '',
      ].filter(Boolean).join(' ');

      const dotContent = !battleMode && isHidden
        ? '<span class="dot-x">×</span>'
        : battleMode && isBattleActive
          ? '<span class="dot-check">✓</span>'
          : '';

      li.innerHTML = `
        <button class="driver-btn" aria-pressed="${battleMode ? isBattleActive : !isHidden}">
          <span class="color-dot" style="background:${driver.color};box-shadow:0 0 6px ${driver.color}60">
            ${dotContent}
          </span>
          <span class="driver-code">${driver.code}</span>
          <span class="driver-name">${driver.name}</span>
        </button>
        <span class="team-name">${driver.team}</span>
      `;

      li.querySelector('.driver-btn').addEventListener('click', () => toggleDriver(driver.id));
      li.addEventListener('mouseenter', () => { highlightedDriver = driver.id; applyHighlightToChart(); updateDriverHighlight(); });
      li.addEventListener('mouseleave', () => { highlightedDriver = null; applyHighlightToChart(); updateDriverHighlight(); });

      elDriversUl.appendChild(li);
    });
  }

  function updateDriverHighlight() {
    elDriversUl.querySelectorAll('.driver-item').forEach(li => {
      const id = li.dataset.driverId;
      li.classList.toggle('highlighted', highlightedDriver === id);
    });
  }

  function toggleDriver(id) {
    if (battleMode) {
      const idx = battleDrivers.indexOf(id);
      if (idx >= 0) {
        battleDrivers = battleDrivers.filter(d => d !== id);
      } else if (battleDrivers.length < 2) {
        battleDrivers = [...battleDrivers, id];
      }
    } else {
      const next = new Set(hiddenDrivers);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      hiddenDrivers = next;
    }
    updateBattleUI();
    renderDriverList();
    updateChart();
  }

  function toggleBattleMode() {
    battleMode = !battleMode;
    if (!battleMode) battleDrivers = [];
    updateBattleUI();
    renderDriverList();
    updateChart();
  }

  function showAll() {
    hiddenDrivers = new Set();
    renderDriverList();
    updateChart();
  }

  function hideAll() {
    hiddenDrivers = new Set(sortedDrivers.map(d => d.id));
    renderDriverList();
    updateChart();
  }

  function updateBattleUI() {
    elBtnBattle.classList.toggle('active', battleMode);
    elBtnBattle.textContent = battleMode ? '✕ BATTLE' : '⚔ BATTLE';
    elBtnShowAll.style.display = battleMode ? 'none' : '';
    elBtnHideAll.style.display = battleMode ? 'none' : '';
    elBattleTag.style.display = battleMode && battleDrivers.length === 2 ? '' : 'none';

    if (battleMode) {
      elBattleHint.style.display = '';
      if (battleDrivers.length < 2) {
        const remaining = 2 - battleDrivers.length;
        elBattleHint.textContent = `Select ${remaining} more driver${remaining === 1 ? '' : 's'}`;
      } else {
        const names = battleDrivers.map(id => {
          const d = sortedDrivers.find(x => x.id === id);
          return d?.name?.split(' ').pop() ?? id;
        });
        elBattleHint.textContent = `Comparing ${names.join(' vs ')}`;
      }
    } else {
      elBattleHint.style.display = 'none';
    }
  }

  // ── SCRUBBER / PLAYBACK ────────────────────────────────────────────────
  function seek(race) {
    currentRace = Math.max(0, Math.min(race, seasonData?.totalRaces ?? 0));
    elScrubber.value = currentRace;
    updateScrubberUI();
    updateLeaderboard();
    updateChart();
  }

  function updateScrubberUI() {
    const total = seasonData?.totalRaces ?? 0;
    const progress = total > 0 ? (currentRace / total) * 100 : 0;

    elScrubber.style.background = `linear-gradient(to right, var(--accent) 0%, var(--accent) ${progress}%, var(--border) ${progress}%, var(--border) 100%)`;

    if (currentRace === 0) {
      elRaceCounter.innerHTML = `<span class="muted">— / ${total}</span>`;
      elRaceNameDisp.textContent = 'Start';
      elRaceDateDisp.textContent = '';
    } else {
      elRaceCounter.innerHTML = `<strong>R${currentRace}</strong><span class="muted"> / ${total}</span>`;
      const snap = seasonData.timeline[currentRace - 1];
      elRaceNameDisp.textContent = snap?.name ?? '';
      if (snap?.date) {
        elRaceDateDisp.textContent = new Date(snap.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      } else {
        elRaceDateDisp.textContent = '';
      }
    }

    // Chart title
    if (currentRace === 0) {
      elChartTitle.innerHTML = '<span>Select a race to begin</span>';
    } else if (currentRace < total) {
      const name = seasonData.timeline[currentRace - 1]?.name ?? '';
      elChartTitle.innerHTML = `<span>After Race ${currentRace}</span><span class="race-name">— ${name}</span>`;
    } else {
      elChartTitle.innerHTML = `<span>Final Championship Standings</span><span class="race-name">— ${seasonData.year} Season</span>`;
    }
  }

  function startPlayback() {
    if (!seasonData) return;
    if (currentRace >= seasonData.totalRaces) seek(0);
    isPlaying = true;
    elBtnPlay.classList.add('playing');
    elBtnPlay.innerHTML = '<span class="icon-pause"><span></span><span></span></span>';
    playInterval = setInterval(() => {
      if (currentRace < seasonData.totalRaces) {
        seek(currentRace + 1);
      } else {
        stopPlayback();
      }
    }, animationSpeed);
  }

  function stopPlayback() {
    isPlaying = false;
    if (playInterval) { clearInterval(playInterval); playInterval = null; }
    elBtnPlay.classList.remove('playing');
    elBtnPlay.innerHTML = '<span class="icon-play">▶</span>';
  }

  function togglePlayback() {
    if (isPlaying) stopPlayback();
    else startPlayback();
  }

  // ── EVENT LISTENERS ────────────────────────────────────────────────────
  elBtnPlay.addEventListener('click', togglePlayback);
  elBtnRewind.addEventListener('click', () => { stopPlayback(); seek(0); });
  elBtnEnd.addEventListener('click', () => { stopPlayback(); seek(seasonData?.totalRaces ?? 0); });
  elScrubber.addEventListener('input', () => { stopPlayback(); seek(Number(elScrubber.value)); });
  elBtnBattle.addEventListener('click', toggleBattleMode);
  elBtnShowAll.addEventListener('click', showAll);
  elBtnHideAll.addEventListener('click', hideAll);

  document.querySelectorAll('.btn-speed').forEach(btn => {
    btn.addEventListener('click', () => {
      animationSpeed = Number(btn.dataset.speed);
      document.querySelectorAll('.btn-speed').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (isPlaying) { stopPlayback(); startPlayback(); }
    });
  });

  // ── START ──────────────────────────────────────────────────────────────
  attachCanvasHover();
  init();
</script>
</body>
</html>
