server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with cache headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve JSON data files without aggressive caching
    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: all routes serve the SvelteKit fallback HTML
    # adapter-static generates '404.html' as the client-side entry point
    location / {
        try_files $uri $uri/ /index.html;
    }
}
